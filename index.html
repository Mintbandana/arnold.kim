<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>charlie</title>
  <meta name="description" content="Charlie.">
  <meta name="theme-color" content="#fbf3e8">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta property="og:title" content="charlie">
  <meta property="og:image" content="https://arnold.kim/images/charlie.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fbf3e8;
      --ink: #6b5444;
      --blush: #f3c9c2;
      --shadow: rgba(107, 84, 68, 0.14);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #2a2420;
        --ink: #f0dfcc;
        --blush: #8a5a52;
        --shadow: rgba(0, 0, 0, 0.35);
      }
    }

    * { box-sizing: border-box; margin: 0; }

    html, body { height: 100%; }

    body {
      display: grid;
      place-items: center;
      min-height: 100svh;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Fredoka", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stage {
      position: relative;
      display: grid;
      place-items: center;
    }

    /* soft blush circle behind the dog */
    .stage::before {
      content: "";
      position: absolute;
      width: 112%;
      left: -6%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--blush);
      opacity: 0.55;
      top: 10%;
    }

    .dog {
      position: relative;
      width: min(calc(100vw - 32px), 41vh, 366px);
      height: auto;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
      transform-origin: 50% 90%;
      animation: breathe 4s ease-in-out infinite;
      transition: rotate 0.35s cubic-bezier(.34, 1.56, .64, 1);
    }
    .dog:hover { rotate: -4deg; }
    .dog.boop { animation: boop 0.45s cubic-bezier(.34, 1.56, .64, 1); }

    /* ground shadow */
    .stage::after {
      content: "";
      position: relative;
      width: 55%;
      height: 14px;
      margin-top: -10px;
      border-radius: 50%;
      background: var(--shadow);
      filter: blur(4px);
      animation: shadow 4s ease-in-out infinite;
    }

    h1 {
      margin-top: 18px;
      font-weight: 500;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      letter-spacing: 0.04em;
    }

    .heart {
      position: fixed;
      pointer-events: none;
      font-size: 22px;
      color: #e9877d;
      animation: float 1.1s ease-out forwards;
    }

    @keyframes breathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-6px) scale(1.012); }
    }
    @keyframes shadow {
      0%, 100% { transform: scaleX(1); opacity: 1; }
      50%      { transform: scaleX(0.92); opacity: 0.75; }
    }
    @keyframes boop {
      0%   { transform: scale(1); }
      40%  { transform: scale(0.94, 1.04); }
      100% { transform: scale(1); }
    }
    @keyframes float {
      0%   { transform: translate(-50%, 0) scale(0.6); opacity: 0; }
      20%  { opacity: 1; }
      100% { transform: translate(calc(-50% + var(--dx)), -90px) scale(1.1); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .dog, .stage::after { animation: none; }
      .dog:hover { rotate: none; }
      .heart { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="stage">
      <img class="dog" src="images/charlie.png" alt="Charlie, a fluffy little dog, sitting and looking at you" width="509" height="723">
    </div>
    <h1>charlie</h1>
  </main>

  <script>
    const dog = document.querySelector('.dog');
    dog.addEventListener('click', (e) => {
      dog.classList.remove('boop');
      void dog.offsetWidth;
      dog.classList.add('boop');
      for (let i = 0; i < 3; i++) {
        const h = document.createElement('span');
        h.className = 'heart';
        h.textContent = '♥';
        h.style.left = e.clientX + 'px';
        h.style.top = e.clientY - 10 + 'px';
        h.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
        h.style.animationDelay = i * 0.12 + 's';
        document.body.appendChild(h);
        h.addEventListener('animationend', () => h.remove());
      }
    });
    dog.addEventListener('animationend', (e) => {
      if (e.animationName === 'boop') dog.classList.remove('boop');
    });
  </script>
</body>
</html>
